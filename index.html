<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Employee Admin Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./src/styles/main.css"/>

    </head>
    <body>
        <main class="login-page">
            <section class="login-card">
                <img src="./src/assets/icons/user_security.svg" alt="" />
                <h1>Employee Admin Dashboard</h1>
                <p>Sign in to your account</p>
                <form class="login-form" novalidate>
                    <div class="form-field">
                        <label for="email">Work Email</label>
                        <div class="input-wrap">
                            <img src="./src/assets/icons/email.svg" alt="" />
                            <input type="email" id="email" name="email" placeholder="name@company.com" />
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <img src="./src/assets/icons/lock.svg" alt="" />
                            <input type="password" id="password" name="password" placeholder="password"/>
                            <img src="./src/assets/icons/visibility.svg" alt="" />
                        </div>
                    </div>
                    <button type="submit">Login to Dashboard</button>
                    <div class="error-message">
                        <div class="error-title">
                            <img src="./src/assets/icons/warning.svg" alt="" />
                            <strong>Validation Errors:</strong>
                        </div>
                        <ul>
                            <li>Invalid email format</li>
                            <li>Password must contain at least 8 characters and one number</li>
                        </ul>
                    </div>
                </form>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
